<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المخبر الطبي المتقدم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 h-screen flex overflow-hidden">

    <aside class="w-64 bg-[#0F172A] text-white flex flex-col justify-between">
        <div>
            <div class="p-6">
                <h1 class="text-xl font-bold text-white">مخبر الشفاء الطبي</h1>
                <p class="text-xs text-slate-400 mt-1">نسخة سطح المكتب (متزامنة)</p>
            </div>
            <div class="border-t border-[#1E293B] mx-4"></div>
            <nav class="mt-4 space-y-1 px-3">
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-[#1E293B] text-white font-semibold">
                    <span>👥</span> الاستقبال وتسجيل المرضى
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-[#1E293B] hover:text-white transition">
                    <span>🔬</span> إدخال وتحليل النتائج
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-[#1E293B] hover:text-white transition">
                    <span>🔍</span> بحث السجلات السابقة
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-[#1E293B] hover:text-white transition">
                    <span>⚙️</span> إعدادات الطباعة والقيم
                </a>
            </nav>
        </div>
        <div class="p-4 text-xs text-emerald-400 text-center border-t border-[#1E293B] flex items-center justify-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> متصل بقاعدة البيانات المشتركة
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between shadow-sm">
            <h2 class="text-xl font-bold text-[#0F172A]">تسجيل مريض جديد (مع ميزة التعرف على المرضى القدامى)</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm text-slate-500">مرحباً، موظف الاستقبال</span>
                <div class="w-10 h-10 rounded-full bg-[#0F172A] text-white flex items-center justify-center font-bold">R</div>
            </div>
        </header>

        <div class="flex-1 p-8 overflow-y-auto">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 max-w-5xl mx-auto">
                <h3 class="text-lg font-bold text-slate-800 mb-6 pb-2 border-b border-slate-100">بيانات المريض والزيارة</h3>
                
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">الرقم الوطني / الرمز الخاص (6 خانات)</label>
                        <input type="text" placeholder="مثال: 482910" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">اسم المريض</label>
                        <input type="text" placeholder="الاسم الثلاثي" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">اسم الأب</label>
                        <input type="text" placeholder="اسم الأب" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">اسم الأم</label>
                        <input type="text" placeholder="اسم الأم" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">العمر</label>
                        <input type="number" placeholder="سنوات" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">الجنس</label>
                        <select class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                            <option>ذكر</option>
                            <option>أنثى</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">رقم الهاتف</label>
                        <input type="text" placeholder="09xxxxxxxx" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">اسم الطبيب المحول</label>
                        <input type="text" placeholder="الدكتور..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#0F172A]">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">التحاليل المطلوبة (مع إمكانية ربط أجهزة الـ CBC تلقائياً)</label>
                    <div class="flex gap-2">
                        <input type="text" value="CBC, Glucose, Lipid Profile" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50" readonly>
                        <button class="bg-blue-50 text-blue-700 border border-blue-200 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-100 transition">ربط جهاز الـ CBC الآلي</button>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button class="px-5 py-2 rounded-lg border border-slate-300 text-slate-600 text-sm hover:bg-slate-50 transition">إلغاء</button>
                    <button class="px-6 py-2 rounded-lg bg-[#0F172A] text-white text-sm hover:bg-slate-800 transition">حفظ وإرسال لقائمة الانتظار</button>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
