<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدخال وتحليل النتائج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 h-screen flex overflow-hidden">
    <aside class="w-64 bg-[#0F172A] text-white flex flex-col justify-between">
        <div>
            <div class="p-6"><h1 class="text-xl font-bold">مخبر الشفاء الطبي</h1></div>
            <nav class="mt-4 space-y-1 px-3">
                <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-[#1E293B] hover:text-white"><span>👥</span> الاستقبال</a>
                <a href="results.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-[#1E293B] text-white font-semibold"><span>🔬</span> إدخال النتائج</a>
                <a href="search.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-[#1E293B] hover:text-white"><span>🔍</span> بحث السجلات</a>
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-[#1E293B] hover:text-white"><span>⚙️</span> الإعدادات والطباعة</a>
            </nav>
        </div>
    </aside>
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-20 bg-white border-b px-8 flex items-center justify-between"><h2 class="text-xl font-bold text-[#0F172A]">إدخال وتحليل النتائج</h2></header>
        <div class="flex-1 p-8 overflow-y-auto">
            <div class="bg-white rounded-xl shadow-sm border p-6 max-w-5xl mx-auto">
                <h3 class="text-lg font-bold mb-4 pb-2 border-b">نتائج الفحوصات الطبية (القيم خارج النطاق تلون بالأحمر تلقائياً)</h3>
                <table class="w-full text-right border-collapse mb-6">
                    <thead><tr class="text-slate-400 text-xs border-b"><th class="pb-2">اسم التحليل</th><th class="pb-2">النتيجة</th><th class="pb-2">النطاق الطبيعي (Normal Range)</th></tr></thead>
                    <tbody class="text-sm divide-y">
                        <tr><td class="py-3 font-semibold">Hemoglobin (Hgb)</td><td class="py-3"><input type="text" value="9.5" class="border border-red-300 text-red-600 font-bold rounded-lg px-3 py-1.5 w-32"></td><td class="py-3 text-slate-500 text-xs">12.0 - 15.5</td></tr>
                        <tr><td class="py-3 font-semibold">Glucose Fasting</td><td class="py-3"><input type="text" value="140" class="border border-red-300 text-red-600 font-bold rounded-lg px-3 py-1.5 w-32"></td><td class="py-3 text-slate-500 text-xs">70 - 99</td></tr>
                    </tbody>
                </table>
                <div class="flex justify-end"><button class="px-6 py-2 rounded-lg bg-emerald-600 text-white text-sm">اعتماد التقرير وترحيله</button></div>
            </div>
        </div>
    </main>
</body>
</html>
